<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | VidForgeLauncher</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">ACCESO RESTRINGIDO</p>
      <h1>VidForgeLauncher</h1>
      <p class="login-copy">Introduce las credenciales configuradas en el servidor.</p>
      <p id="login-error" class="error" hidden>Usuario o contraseña incorrectos.</p>
      <form class="login-form" action="/login" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
