services:
  vidforge-launcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidforge-launcher
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      STATE_FILE: /app/data/state.json
    ports:
      - "8067:3000"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
